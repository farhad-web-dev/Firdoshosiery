<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firdos Hosiery</title>
    <!-- Favicon (Browser Tab Logo) -->
    <link rel="icon" type="image/jpeg" href="ahmed.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0614;
            color: #ffffff;
            overflow-x: hidden;
            padding: 15px;
        }

        .hero-banner {
            text-align: center;
            padding: 25px 15px;
            background: radial-gradient(circle, rgba(20,14,35,0.95) 0%, rgba(5,3,10,0.98) 100%);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .logo-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            margin-bottom: 10px;
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
            letter-spacing: 2px;
        }

        .hero-subtitle {
            font-size: 0.95rem;
            color: #cbd5e1;
            margin-top: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .section-heading {
            font-size: 1.3rem;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 128, 0.5);
            margin: 20px 0 15px 5px;
            letter-spacing: 1px;
            border-bottom: 2px solid #ff007f;
            display: inline-block;
            padding-bottom: 3px;
        }

        .content-container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            padding: 20px;
            background: rgba(20, 14, 35, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 15px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #64748b;
            font-size: 0.85rem;
            padding-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="hero-banner">
        <img src="ahmed.jpg" alt="Firdos Hosiery Logo" class="logo-img">
        <h1 class="hero-title">FIRDOS HOSIERY</h1>
        <p class="hero-subtitle">Quality Clothing & Collections</p>
    </div>

    <div class="content-container">
        <h2 class="section-heading">Welcome to Firdos Hosiery</h2>
        <p style="color: #cbd5e1; margin-top: 10px;">Explore our premium collection and styles designed with comfort.</p>
    </div>

    <footer>
        <p>© 2026 Firdos Hosiery. All rights reserved.</p>
    </footer>

</body>
</html>
